display_information:
  name: AGRO
  description: AI coding agent interface for AGRO sandboxes
  background_color: "#1a1a2e"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: agro
    always_online: true
  slash_commands:
    - command: /help
      description: "DM only: AGRO bridge admin help"
      should_escape: false
    - command: /trusted
      description: "DM only: List trusted AGRO bridge users"
      should_escape: false
    - command: /revoke
      description: "DM only: Revoke trust for an AGRO bridge user"
      usage_hint: <userId>
      should_escape: false
    - command: /channels
      description: "DM only: List AGRO bridge-enabled chats"
      should_escape: false
    - command: /enable
      description: "DM only: Enable the AGRO bridge in a chat"
      usage_hint: <chatId> <all|mentions|trusted-only>
      should_escape: false
    - command: /disable
      description: "DM only: Disable the AGRO bridge in a chat"
      usage_hint: <chatId>
      should_escape: false
    - command: /toggletools
      description: "DM only: Toggle AGRO bridge tool-call visibility"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:read
      - chat:write
      - files:read
      - files:write
      - groups:history
      - groups:read
      - im:history
      - im:read
      - im:write
      - reactions:read
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
