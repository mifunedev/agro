model:
  backend: claude_chat
  optimizer: ""
  target: ""
  optimizer_backend: claude_chat
  target_backend: claude_chat
  reasoning_effort: medium
  rewrite_reasoning_effort: ""
  rewrite_max_completion_tokens: 64000
  codex_trace_to_optimizer: false
  claude_trace_to_optimizer: false

train:
  num_epochs: 8
  train_size: 0
  batch_size: 30
  accumulation: 1
  seed: 42

gradient:
  minibatch_size: 8
  merge_batch_size: 8
  analyst_workers: 4
  failure_only: true

optimizer:
  learning_rate: 4
  min_learning_rate: 2
  lr_scheduler: cosine
  lr_control_mode: fixed
  skill_update_mode: patch
  use_slow_update: false
  slow_update_samples: 0
  slow_update_gate_with_selection: false
  longitudinal_pair_policy: mixed
  use_meta_skill: false
  use_skill_aware_reflection: false
  skill_aware_appendix_source: both
  skill_aware_consolidate_threshold: 0

evaluation:
  use_gate: true
  gate_metric: hard
  sel_env_num: 0
  test_env_num: 0
  eval_test: false

env:
  name: agro_ste
  skill_init: ""
  split_mode: split_dir
  split_seed: 42
  split_dir: ""
  data_path: ""
  split_output_dir: ""
  exec_timeout: 600
  out_root: ""
