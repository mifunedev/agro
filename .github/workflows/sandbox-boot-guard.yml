name: "CI: Sandbox Boot Guard"

on:
  workflow_dispatch:
  push:
    branches:
      - development
    paths:
      - ".devcontainer/**"
      - ".agro/cli/**"
      - "!.agro/cli/**/__tests__/**"
      - "!.agro/cli/**/*.md"
      - ".agro/scripts/docker-compose.sh"
      - ".agro/scripts/check-host-port.sh"
      - ".agro/scripts/paths.sh"
      - ".agro/scripts/provision-python.sh"
      - ".agro/scripts/sandbox-healthcheck.sh"
      - ".agro/scripts/sandbox-boot-smoke.sh"
      - ".agro/scripts/sandbox-upgrade-smoke.sh"
      - ".agro/scripts/cli-first-install-smoke.sh"
      - ".agro/scripts/verify-sandbox-image.sh"
      - ".agro/scripts/install.sh"
      - ".agro/scripts/link-providers.sh"
      - ".agro/install/**"
      - "agro.json"
      - ".example.env"
      - ".dockerignore"
      - ".github/workflows/sandbox-boot-guard.yml"
  pull_request:
    paths:
      - ".devcontainer/**"
      - ".agro/cli/**"
      - "!.agro/cli/**/__tests__/**"
      - "!.agro/cli/**/*.md"
      - ".agro/scripts/docker-compose.sh"
      - ".agro/scripts/check-host-port.sh"
      - ".agro/scripts/paths.sh"
      - ".agro/scripts/provision-python.sh"
      - ".agro/scripts/sandbox-healthcheck.sh"
      - ".agro/scripts/sandbox-boot-smoke.sh"
      - ".agro/scripts/sandbox-upgrade-smoke.sh"
      - ".agro/scripts/cli-first-install-smoke.sh"
      - ".agro/scripts/verify-sandbox-image.sh"
      - ".agro/scripts/install.sh"
      - ".agro/scripts/link-providers.sh"
      - ".agro/install/**"
      - "agro.json"
      - ".example.env"
      - ".dockerignore"
      - ".github/workflows/sandbox-boot-guard.yml"

concurrency:
  group: sandbox-boot-guard-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sandbox-boot-guard:
    name: Validate sandbox compose and image build
    # When CI_RUNNER routes this to self-hosted it MUST be the dind model: this
    # job builds AND boots the devcontainer image, which needs an isolated
    # daemon + a non-root runner. The host-socket model can't.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Ensure Mifune submodule
        run: bash .agro/scripts/link-providers.sh --init

      - name: Docker diagnostics
        run: |
          docker --version
          docker compose version

      # Sandbox boot guard only: validate the local devcontainer substrate.
      # This job never logs in, pushes an image, or publishes release artifacts.
      - name: Validate base compose configuration
        run: bash .agro/scripts/docker-compose.sh config --quiet

      - name: Validate sshd compose overlay
        env:
          SANDBOX_SSH: "true"
          SANDBOX_SSH_PORT_CHECK: "off"
        run: bash .agro/scripts/docker-compose.sh config --quiet

      - name: Build sandbox image locally
        env:
          SANDBOX_NAME: agro-boot-guard-${{ github.run_id }}
        run: |
          docker build \
            --file .devcontainer/Dockerfile \
            --tag "sandbox-${SANDBOX_NAME}" \
            --tag agro-sandbox-boot-guard:${{ github.sha }} \
            .

      # Reusable image verification: base distribution, apt suites, the built-in
      # sandbox UID/GID contract, the Node/pnpm pins, the architecture-specific
      # Herdr checksum, and version output from every required default tool.
      - name: Verify sandbox image contract
        run: bash .agro/scripts/verify-sandbox-image.sh agro-sandbox-boot-guard:${{ github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Build candidate CLI
        run: |
          npm --prefix .agro/cli ci --ignore-scripts
          npm --prefix .agro/cli run build

      - name: Candidate bootstrap without Node
        run: |
          docker run --rm \
            -e AGRO_ASSUME_YES=1 \
            -v "${{ github.workspace }}:/src:ro" \
            debian:bookworm-slim \
            bash -lc '
              set -euo pipefail
              apt-get update
              apt-get install -y --no-install-recommends curl ca-certificates bash
              if command -v node >/dev/null 2>&1; then echo "node unexpectedly present"; exit 1; fi
              echo "node_before=ABSENT"
              bash /src/.agro/scripts/cli-first-install-smoke.sh \
                --phase bootstrap \
                --bootstrap-without-node \
                --bundle /src/.agro/cli/dist/agro.js \
                --keep
            '

      - name: Candidate CLI-first install and recreation smoke
        env:
          CANDIDATE_IMAGE: agro-sandbox-boot-guard:${{ github.sha }}
        run: |
          set -o pipefail
          bash .agro/scripts/cli-first-install-smoke.sh \
            --phase all \
            --image "$CANDIDATE_IMAGE" \
            --require-docker \
            2>&1 | tee cli-first-install-smoke.log

      - name: Upload the CLI-first smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cli-first-install-smoke-log-${{ github.run_id }}
          path: cli-first-install-smoke.log
          if-no-files-found: warn

      # This step is the ONLY place a full boot on a fresh home volume runs end to
      # end (the smoke tears down with `down -v`), and the smoke asserts that the
      # boot installed no harness and no tool into it.
      - name: Boot sandbox and verify healthcheck (asserts boot installs nothing)
        env:
          SANDBOX_NAME: agro-boot-guard-${{ github.run_id }}
          # The smoke deadline has to clear the compose healthcheck's 600s
          # start_period plus the 3x30s retry window (~690s), not just the old
          # 300s one.
          BOOT_SMOKE_TIMEOUT_SECONDS: "1200"
          BOOT_SMOKE_INTERVAL_SECONDS: "10"
        run: bash .agro/scripts/sandbox-boot-smoke.sh

  sandbox-upgrade-guard:
    name: Boot a legacy volume against the fresh image
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Ensure Mifune submodule
        run: bash .agro/scripts/link-providers.sh --init

      - name: Docker diagnostics
        run: |
          docker --version
          docker compose version

      - name: Upgrade a legacy workspace volume to the freshly built image
        env:
          UPGRADE_SMOKE_PROJECT: agro-upgrade-${{ github.run_id }}
          UPGRADE_SMOKE_TIMEOUT_SECONDS: "1200"
          UPGRADE_SMOKE_INTERVAL_SECONDS: "10"
        run: |
          set -o pipefail
          bash .agro/scripts/sandbox-upgrade-smoke.sh 2>&1 | tee sandbox-upgrade-smoke.log

      - name: Upload the upgrade smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandbox-upgrade-smoke-log-${{ github.run_id }}
          path: sandbox-upgrade-smoke.log
          if-no-files-found: warn
