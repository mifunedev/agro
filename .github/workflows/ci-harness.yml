name: "CI: Harness"

on:
  workflow_dispatch:
  push:
    branches:
      - development
      - main
    paths:
      - ".agro/**"
      - "docs/**"
      - ".pi/**"
      - "agro.json"
      - ".example.env"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "vitest.config.ts"
      - ".github/workflows/ci-harness.yml"
      - ".claude/hooks/**"
      - ".claude/protected-paths.txt"
      - "crons/**"
      - ".devcontainer/**"
      - "AGENTS.md"
  pull_request:
    paths:
      - ".agro/**"
      - "docs/**"
      - ".pi/**"
      - "agro.json"
      - ".example.env"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "vitest.config.ts"
      - ".github/workflows/ci-harness.yml"
      - ".claude/hooks/**"
      - ".claude/protected-paths.txt"
      - "crons/**"
      - ".devcontainer/**"
      - "AGENTS.md"

concurrency:
  group: ci-harness-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: "Typecheck, Build & Test"
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Ensure Mifune submodule
        run: bash .agro/scripts/link-providers.sh --init

      - name: Setup Node 22.x
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store/v3
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-

      - name: Run pnpm security audit
        run: pnpm run security:audit

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build:harness

      - name: Test
        run: pnpm test:scripts

  boot-lint:
    name: Boot Path Lint (shellcheck + hadolint)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Ensure Mifune submodule
        run: bash .agro/scripts/link-providers.sh --init

      - name: Shellcheck boot scripts
        run: |
          command -v shellcheck >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y shellcheck; }
          shellcheck --version
          shellcheck -S warning .devcontainer/*.sh .agro/install/*.sh .agro/scripts/*.sh .agro/hooks/*.sh

      - name: Hadolint Dockerfile
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: .devcontainer/Dockerfile
          config: .hadolint.yaml
          failure-threshold: warning

      - name: Check pnpm pin drift
        run: bash .agro/scripts/check-pnpm-pin.sh

      - name: Check version parity
        run: bash .agro/scripts/version-parity.sh
