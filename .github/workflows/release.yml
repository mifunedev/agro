name: Release

# Run every release-branch push. Do not add one shared concurrency group:
# GitHub keeps only one pending run per group and could drop intermediate pushes.
on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write
  packages: write

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout the event commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          submodules: recursive

      - name: Ensure Mifune submodule
        run: bash .agro/scripts/link-providers.sh --init

      - name: Setup Node 22.x
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store/v3
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-

      - name: Run pnpm security audit
        run: pnpm run security:audit

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build:harness

      - name: Test
        run: pnpm test:scripts

      - name: Check pnpm pin drift
        run: bash .agro/scripts/check-pnpm-pin.sh

  boot-lint:
    name: Boot Path Lint (shellcheck + hadolint)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout the event commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          submodules: recursive

      - name: Ensure Mifune submodule
        run: bash .agro/scripts/link-providers.sh --init

      - name: Shellcheck boot scripts
        run: |
          command -v shellcheck >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y shellcheck; }
          shellcheck --version
          shellcheck -S warning .devcontainer/*.sh .agro/install/*.sh .agro/scripts/*.sh .agro/skills/audit/scripts/*.sh .claude/hooks/*.sh .claude/skills/retro/scripts/*.sh

      - name: Hadolint Dockerfile
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: .devcontainer/Dockerfile
          config: .hadolint.yaml
          failure-threshold: warning

  eval-probes:
    name: Eval Probe Regression Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout the event commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          submodules: recursive

      - name: Link provider skills
        run: bash .agro/scripts/link-providers.sh --init

      - name: Run eval probe suite
        run: bash .agro/skills/eval/run.sh

  reserve:
    name: Reserve SemVer draft
    needs: [validate, boot-lint, eval-probes]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      releaseVersion: ${{ steps.reserve_release.outputs.releaseVersion }}
      releaseSha: ${{ steps.reserve_release.outputs.releaseSha }}
      releaseId: ${{ steps.reserve_release.outputs.releaseId }}
      publishedNoop: ${{ steps.reserve_release.outputs.publishedNoop }}

    steps:
      - name: Checkout the validated event commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      # Root package.json is the single source of truth for the release version.
      # It is a committed file, so retries read the same value, and cutting a
      # release is a deliberate bump rather than a function of the push clock.
      - name: Read the release version from package.json
        id: release_version
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Release version from package.json: $V"

      - name: Atomically reserve the SemVer tag and ensure its draft release
        id: reserve_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
        run: node .agro/scripts/reserve-github-release.mjs

  publish-image:
    name: Build, smoke, and publish GHCR image
    needs: reserve
    if: ${{ needs.reserve.outputs.publishedNoop != 'true' }}
    runs-on: ubuntu-latest
    # `needs` is valid in job concurrency expressions. Atomic reservations give
    # distinct push SHAs distinct versions; only same-SHA retries share this key.
    concurrency:
      group: release-image-${{ needs.reserve.outputs.releaseVersion }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout the reserved commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.reserve.outputs.releaseSha }}
          submodules: recursive

      - name: Ensure Mifune submodule
        run: bash .agro/scripts/link-providers.sh --init

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build immutable Docker image tags
        env:
          RELEASE_SHA: ${{ needs.reserve.outputs.releaseSha }}
          RELEASE_VERSION: ${{ needs.reserve.outputs.releaseVersion }}
          SANDBOX_NAME: agro-release-smoke-${{ github.run_id }}
        run: |
          VERSION_IMAGE="ghcr.io/mifunedev/openharness:${RELEASE_VERSION}"
          SHA_IMAGE="ghcr.io/mifunedev/openharness:sha-${RELEASE_SHA}"
          AGRO_VERSION_IMAGE="ghcr.io/mifunedev/agro:${RELEASE_VERSION}"
          AGRO_SHA_IMAGE="ghcr.io/mifunedev/agro:sha-${RELEASE_SHA}"
          SMOKE_IMAGE="sandbox-${SANDBOX_NAME}"
          docker buildx build --load -f .devcontainer/Dockerfile \
            -t "$VERSION_IMAGE" -t "$SHA_IMAGE" \
            -t "$AGRO_VERSION_IMAGE" -t "$AGRO_SHA_IMAGE" -t "$SMOKE_IMAGE" .

      # Keep this pre-push smoke gate between build and publication: it boots
      # the exact image object that carries all four immutable GHCR tags.
      - name: Smoke-test Docker image before publish
        env:
          SANDBOX_NAME: agro-release-smoke-${{ github.run_id }}
          BOOT_SMOKE_TIMEOUT_SECONDS: "900"
          BOOT_SMOKE_INTERVAL_SECONDS: "10"
          BOOT_SMOKE_UP_ARGS: "up -d --no-build"
        run: bash .agro/scripts/sandbox-boot-smoke.sh

      - name: Smoke-test agro as a first-class entry point
        env:
          SANDBOX_NAME: agro-release-smoke-${{ github.run_id }}
          RELEASE_VERSION: ${{ needs.reserve.outputs.releaseVersion }}
        run: |
          SMOKE_IMAGE="sandbox-${SANDBOX_NAME}"
          agro_version=$(docker run --rm --entrypoint /bin/bash "$SMOKE_IMAGE" -lc 'agro --version')
          oh_version=$(docker run --rm --entrypoint /bin/bash "$SMOKE_IMAGE" -lc 'oh --version')
          echo "agro --version: $agro_version"
          echo "oh --version: $oh_version"
          if [ -z "$agro_version" ] || [ "$agro_version" != "$oh_version" ]; then
            echo "agro --version ('$agro_version') and oh --version ('$oh_version') must be the same non-empty version" >&2
            exit 1
          fi
          if [ "$agro_version" != "$RELEASE_VERSION" ]; then
            echo "agro --version ('$agro_version') does not match the release version $RELEASE_VERSION" >&2
            exit 1
          fi

      - name: Push immutable SemVer and sha-full-SHA tags
        env:
          RELEASE_SHA: ${{ needs.reserve.outputs.releaseSha }}
          RELEASE_VERSION: ${{ needs.reserve.outputs.releaseVersion }}
        run: |
          docker push "ghcr.io/mifunedev/openharness:${RELEASE_VERSION}"
          docker push "ghcr.io/mifunedev/openharness:sha-${RELEASE_SHA}"
          docker push "ghcr.io/mifunedev/agro:${RELEASE_VERSION}"
          docker push "ghcr.io/mifunedev/agro:sha-${RELEASE_SHA}"

      - name: Verify the agro and openharness version tags share one digest
        env:
          RELEASE_VERSION: ${{ needs.reserve.outputs.releaseVersion }}
        run: |
          .agro/scripts/verify-release-aliases.sh check \
            "ghcr.io/mifunedev/openharness:${RELEASE_VERSION}" \
            "ghcr.io/mifunedev/agro:${RELEASE_VERSION}"

      - name: Promote latest from the canonical branch by digest
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
          RELEASE_SHA: ${{ needs.reserve.outputs.releaseSha }}
          RELEASE_VERSION: ${{ needs.reserve.outputs.releaseVersion }}
        run: .agro/scripts/promote-release-latest.sh promote

  publish-cli:
    name: Publish CLI for the released commit
    needs: [reserve, publish-image]
    if: ${{ needs.reserve.outputs.publishedNoop != 'true' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-cli.yml
    with:
      ref: ${{ needs.reserve.outputs.releaseSha }}
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  finalize:
    name: Finalize GitHub Release
    needs: [reserve, publish-image, publish-cli]
    if: ${{ always() && needs.reserve.outputs.publishedNoop != 'true' && needs.publish-image.result == 'success' && needs.publish-cli.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout the published commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.reserve.outputs.releaseSha }}

      - name: Setup Node 22.x
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Build the CLI bundles at the released commit
        run: |
          npm --prefix .agro/cli ci --ignore-scripts
          npm --prefix .agro/cli run build

      - name: Upload the CLI bundles and installers as release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.reserve.outputs.releaseVersion }}
        run: |
          gh release upload "v${RELEASE_VERSION}" --clobber \
            .agro/cli/dist/agro.js \
            .agro/cli/dist/oh.js \
            .agro/scripts/get-agro.sh \
            .agro/scripts/get-oh.sh

      - name: Extract release notes from CHANGELOG
        env:
          RELEASE_VERSION: ${{ needs.reserve.outputs.releaseVersion }}
        run: |
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          # Match the heading as a literal prefix, never as a built regex. In an
          # awk string, `\[` is not an escape: gawk drops the backslash, so a
          # pattern built as ("^## \[" ver "\] - ") becomes a character class and
          # matches nothing. mawk keeps it, which is why this reads as correct in
          # a local sandbox and fails on the runner. `index()` has no such trap.
          awk -v hdr="## [$RELEASE_VERSION] - " '
            index($0, hdr) == 1 { in_block=1; next }
            in_block && /^## \[/ { exit }
            in_block && /^---[[:space:]]*$/ { exit }
            in_block { print }
          ' CHANGELOG.md > "$NOTES_FILE"
          if [ ! -s "$NOTES_FILE" ] || ! grep -q '[^[:space:]]' "$NOTES_FILE"; then
            awk '
              /^## \[Unreleased\]$/ { in_block=1; next }
              in_block && /^## \[/ { exit }
              in_block && /^---[[:space:]]*$/ { exit }
              in_block { print }
            ' CHANGELOG.md > "$NOTES_FILE"
          fi
          if [ ! -s "$NOTES_FILE" ] || ! grep -q '[^[:space:]]' "$NOTES_FILE"; then
            echo "Release $RELEASE_VERSION — see CHANGELOG.md and commit history." > "$NOTES_FILE"
          fi

      # Re-run the same canonical main-else-master rule after CLI publication.
      # This fresh remote read makes noncanonical releases unconditionally
      # make_latest=false and catches a newer canonical push before finalization.
      - name: Check canonical branch for GitHub latest-release status
        id: github_latest
        env:
          RELEASE_BRANCH: ${{ github.ref_name }}
          RELEASE_SHA: ${{ needs.reserve.outputs.releaseSha }}
        run: .agro/scripts/promote-release-latest.sh check

      - name: Publish the draft after image and CLI publication
        uses: actions/github-script@v7
        env:
          MAKE_LATEST: ${{ steps.github_latest.outputs.makeLatest }}
          RELEASE_ID: ${{ needs.reserve.outputs.releaseId }}
          RELEASE_VERSION: ${{ needs.reserve.outputs.releaseVersion }}
        with:
          script: |
            const fs = require("fs");
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split("/");
            const releaseId = Number(process.env.RELEASE_ID);
            const releaseVersion = process.env.RELEASE_VERSION;
            const body = fs.readFileSync(`${process.env.RUNNER_TEMP}/release-notes.md`, "utf8");
            if (!Number.isSafeInteger(releaseId) || releaseId <= 0) {
              throw new Error(`invalid release ID: ${process.env.RELEASE_ID}`);
            }
            if (!new Set(["true", "false"]).has(process.env.MAKE_LATEST)) {
              throw new Error(`invalid make_latest decision: ${process.env.MAKE_LATEST}`);
            }
            if (body.trim() === "") {
              throw new Error(`empty release notes for ${releaseVersion}`);
            }
            await github.rest.repos.updateRelease({
              owner,
              repo,
              release_id: releaseId,
              name: `v${releaseVersion}`,
              body,
              draft: false,
              make_latest: process.env.MAKE_LATEST,
            });

  notify-docs:
    name: Notify the docs site
    needs: [reserve, finalize]
    if: ${{ needs.reserve.outputs.publishedNoop != 'true' && needs.finalize.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Send the agro-release repository_dispatch
        env:
          AGRO_WEB_DISPATCH_TOKEN: ${{ secrets.AGRO_WEB_DISPATCH_TOKEN }}
          AGRO_WEB_REPO: ${{ vars.AGRO_WEB_REPO || 'mifunedev/openharness-web' }}
          RELEASE_SHA: ${{ needs.reserve.outputs.releaseSha }}
        run: |
          if [ -z "$AGRO_WEB_DISPATCH_TOKEN" ]; then
            echo "::notice::Secret AGRO_WEB_DISPATCH_TOKEN is not set; skipping the agro-release dispatch to $AGRO_WEB_REPO"
            exit 0
          fi
          GH_TOKEN="$AGRO_WEB_DISPATCH_TOKEN" gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${AGRO_WEB_REPO}/dispatches" \
            -f event_type=agro-release \
            -f "client_payload[ref]=${RELEASE_SHA}"
          echo "Dispatched agro-release for $RELEASE_SHA to $AGRO_WEB_REPO"

  # publish-cli.yml also remains independently dispatchable with an explicit ref.
