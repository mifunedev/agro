name: ${SANDBOX_NAME:-agro}

services:
  sandbox:
    image: ${AGRO_SANDBOX_IMAGE:-${OH_SANDBOX_IMAGE:-sandbox-${SANDBOX_NAME:-agro}}}
    pull_policy: ${AGRO_PULL_POLICY:-${OH_PULL_POLICY:-missing}}
    container_name: ${SANDBOX_NAME:-agro}
    build:
      context: ${AGRO_REPO_DIR:-${OH_REPO_DIR:-..}}
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ${AGRO_HOME_MOUNT:-${OH_HOME_MOUNT:-workspace}}:/home/sandbox
      - ${AGRO_REPO_DIR:-${OH_REPO_DIR:-..}}:/home/sandbox/harness
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SANDBOX_NAME=${SANDBOX_NAME:-agro}
      - SANDBOX_PASSWORD=${SANDBOX_PASSWORD:-test1234}
      - TZ=${TZ:-America/Los_Angeles}
      - CLAUDE_DANGEROUSLY_SKIP_PERMISSIONS=true
      - CC_SAFETY_NET_STRICT=1
      - CC_SAFETY_NET_WORKTREE=1
      - GIT_USER_NAME=${GIT_USER_NAME:-}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL:-}
      - GH_TOKEN=${GH_TOKEN:-}
    stdin_open: true
    tty: true
    cgroup: private
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor=unconfined
    tmpfs:
      - /run
      - /run/lock
      - /sys/fs
    healthcheck:
      test: ["CMD", "bash", "-c", "if [ -d /home/sandbox/harness/.agro ]; then exec bash /home/sandbox/harness/.agro/scripts/sandbox-healthcheck.sh; fi; exec bash /home/sandbox/harness/.oh/scripts/sandbox-healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 600s
    restart: unless-stopped

volumes:
  workspace:
