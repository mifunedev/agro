version: 1

network_policies:
  github:
    endpoints:
      - host: github.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-write
      - host: api.github.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-write
      - host: release-assets.githubusercontent.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - path: /usr/bin/git
      - path: /usr/bin/gh
      - path: /usr/bin/curl
  npm:
    endpoints:
      - host: registry.npmjs.org
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
        allow_encoded_slash: true
    binaries:
      - path: /usr/local/bin/node
  anthropic:
    endpoints:
      - host: api.anthropic.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-write
      - host: platform.claude.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-write
    binaries:
      - path: /home/sandbox/.local/lib/node_modules/@anthropic-ai/claude-code/bin/*
